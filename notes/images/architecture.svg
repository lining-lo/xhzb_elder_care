<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="550" viewBox="0 0 1200 550" role="img" aria-labelledby="archTitle archDesc">
  <title id="archTitle">星海智伴系统架构与数据流</title>
  <desc id="archDesc">系统地图：左侧为两个客户端，管理后台（Vue 3 + Element Plus，开发端口 9001）与家属端微信小程序（mp-weixin，接口前缀 /member）；中间为共用的一套后端服务（RuoYi-Vue 3.9.0 / Spring Boot 3.5 / Java 17 / 8 个 Maven 模块），内部包含两套互不干扰的多终端认证：管理后台走 LoginUser 加 Redis 会话，家属端走 MemberInterceptor；右侧为下游依赖：MySQL 8 与 Redis、Spring AI 对接 DashScope 与 DeepSeek、华为云 IoTDA 与智能手环与智能床垫、Dify 与 RAGFlow。底部为设备上报数据流：智能设备、华为云 IoTDA、AMQP 转发、落库与 Redis 缓存最新值、智能床位与健康数据展示。</desc>

  <rect width="1200" height="550" rx="26" fill="#0D1B1E"/>

  <text x="64" y="68" font-size="20" letter-spacing="2" font-family="MONO" fill="#8AA3A8">SYSTEM MAP · 双端一套后端</text>

  <g id="clients">
    <rect x="64" y="116" width="260" height="112" rx="16" fill="#14262B" stroke="#21414A" stroke-width="1.5"/>
    <circle cx="82" cy="152" r="5" fill="#00B8A0"/>
    <text x="98" y="160" font-size="24" font-weight="600" font-family="$SANS" fill="#E8F1F2">管理后台</text>
    <text x="98" y="192" font-size="16" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#8AA3A8">Vue 3 · Element Plus</text>
    <text x="98" y="216" font-size="16" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#8AA3A8">开发端口 9001</text>

    <rect x="64" y="262" width="260" height="112" rx="16" fill="#14262B" stroke="#21414A" stroke-width="1.5"/>
    <circle cx="82" cy="298" r="5" fill="#FE6A3D"/>
    <text x="98" y="306" font-size="24" font-weight="600" font-family="$SANS" fill="#E8F1F2">家属端小程序</text>
    <text x="98" y="338" font-size="16" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#8AA3A8">微信小程序 · /member</text>
    <text x="98" y="362" font-size="16" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#8AA3A8">mp-weixin 目录</text>
  </g>

