    <text x="428" y="162" font-size="28" font-weight="600" font-family="$SANS" fill="#E8F1F2">星海智伴后端服务</text>
    <text x="428" y="194" font-size="16" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#8AA3A8">RuoYi-Vue 3.9.0 · Spring Boot 3.5</text>
    <text x="428" y="218" font-size="16" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#8AA3A8">Java 17 · 8 个 Maven 模块</text>
    <line x1="428" y1="236" x2="832" y2="236" stroke="#21414A" stroke-width="1.5"/>
    <text x="428" y="262" font-size="18" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#7C9498">多终端认证</text>

    <rect x="428" y="276" width="184" height="104" rx="12" fill="#0F2025" stroke="#21414A"/>
