    <path d="M390 166 L404 172 L390 178 Z" fill="#3B565C"/>
    <line x1="324" y1="318" x2="390" y2="318" stroke="#3B565C" stroke-width="2"/>
    <path d="M390 312 L404 318 L390 324 Z" fill="#3B565C"/>
  </g>

