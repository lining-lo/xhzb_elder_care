<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="432" viewBox="0 0 1200 432" role="img" aria-labelledby="heroTitle heroDesc">
  <title id="heroTitle">星海智伴 · 智慧养老护理平台</title>
  <desc id="heroDesc">星海智伴：面向养老院的一体化管理平台。左侧为项目名称与一句话说明，说明管理后台与家属端小程序共用一套后端，护理任务、账单与异常报警由系统自动生成；右侧为智能床位功能的结构示意图（楼层、房间、床位与设备，含在住/空闲状态与体征波形报警标记）；底部为业务主线：来访登记、入住办理、在住管理、服务管理、财务管理。</desc>

  <rect width="1200" height="432" rx="26" fill="#0D1B1E"/>

  <g id="title-block" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif">
    <text x="64" y="78" font-size="20" letter-spacing="2" fill="#8AA3A8">智慧养老 · 一体化管理平台</text>
    <text x="64" y="152" font-size="76" font-weight="700" fill="#E8F1F2">星海智伴</text>
    <text x="64" y="202" font-size="26" fill="#C3D4D6">养老院员工用管理后台，家属用微信小程序，</text>
    <text x="64" y="240" font-size="26" fill="#C3D4D6">护理任务、账单、异常报警由系统自动生成。</text>
    <text x="64" y="286" font-size="18" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#8AA3A8">RuoYi-Vue 3.9.0 · Spring Boot 3.5 · Vue 3 · 8 个 Maven 模块</text>
    <circle cx="70" cy="317" r="5" fill="#00B8A0"/>
    <text x="84" y="323" font-size="18" fill="#9FB6B9">管理后台（员工端）</text>
    <circle cx="288" cy="317" r="5" fill="#FE6A3D"/>
    <text x="302" y="323" font-size="18" fill="#9FB6B9">家属端小程序（家属端）</text>
  </g>

  <g id="live-floor">
