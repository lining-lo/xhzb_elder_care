    <text x="724" y="96" font-size="22" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" fill="#E8F1F2">智能床位</text>
    <text x="822" y="96" font-size="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" fill="#7C9498">示意</text>
    <text x="1112" y="96" font-size="18" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#8AA3A8">3F · 301</text>
    <line x1="724" y1="110" x2="1112" y2="110" stroke="#21414A" stroke-width="1.5"/>

    <rect x="724" y="124" width="118" height="90" rx="14" fill="#0F2025" stroke="#21414A"/>
    <text x="738" y="154" font-size="18" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#8AA3A8">301-01</text>
    <text x="738" y="186" font-size="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" fill="#00B8A0">在住</text>
    <circle cx="828" cy="148" r="5" fill="#00B8A0"/>

    <rect x="858" y="124" width="118" height="90" rx="14" fill="#0F2025" stroke="#21414A"/>
