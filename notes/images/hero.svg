    <circle cx="962" cy="148" r="5" fill="#00B8A0"/>

    <rect x="992" y="124" width="118" height="90" rx="14" fill="#0F2025" stroke="#21414A" stroke-dasharray="5 4"/>
    <text x="1006" y="154" font-size="18" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#8AA3A8">301-03</text>
    <text x="1006" y="186" font-size="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" fill="#7C9498">空闲</text>
    <circle cx="1096" cy="148" r="5" fill="#3B565C"/>

    <text x="724" y="246" font-size="18" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#7C9498">智能手环 · 实时体征</text>
